name: Build Connect to PC

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r host/requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name ConnectToPCVR host/ConnectToPCVR.py
      - uses: actions/upload-artifact@v4
        with:
          name: ConnectToPCVR-Windows
          path: dist/ConnectToPCVR.exe

  android-phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build phone APK
        run: gradle --no-daemon -p android assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ConnectToPCPhone-Android
          path: android/app/build/outputs/apk/release/app-release.apk
