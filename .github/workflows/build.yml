name: Build Connect to PC VR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build host EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r host/requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name ConnectToPCVR host/ConnectToPCVR.py
      - uses: actions/upload-artifact@v4
        with:
          name: ConnectToPCVR-Windows
          path: dist/ConnectToPCVR.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Install Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Godot Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME_17_X64}"
          EOF
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          mkdir -p artifacts
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path vr --editor --quit
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path vr --export-debug "Android Quest" ../artifacts/ConnectToPCVR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ConnectToPCVR-Android
          path: artifacts/ConnectToPCVR.apk
